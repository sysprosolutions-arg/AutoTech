name: CI

on:
  push:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Calidad y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Obtener el código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: mbstring, pdo_sqlite, sqlite3
          tools: composer:v2

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Instalar dependencias web
        run: npm ci

      - name: Preparar entorno de pruebas
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Verificar formato PHP
        run: vendor/bin/pint --test

      - name: Compilar recursos web
        run: npm run build

      - name: Ejecutar pruebas automatizadas
        run: php artisan test

