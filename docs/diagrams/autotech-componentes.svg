<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180" role="img" aria-labelledby="title desc">
  <title id="title">AutoTech S.A. — Diagrama de Componentes</title>
  <desc id="desc">Arquitectura del monolito modular Laravel, interfaces de usuario, seguridad, módulos funcionales, persistencia y empaquetado NativePHP.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3b43"/>
      <stop offset="1" stop-color="#14616a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38545a"/>
    </marker>
    <style>
      .title{font:700 32px 'Segoe UI',Arial,sans-serif;fill:#fff}.subtitle{font:400 16px 'Segoe UI',Arial,sans-serif;fill:#d7eef0}
      .frame{fill:#f8fbfb;stroke:#173f46;stroke-width:2}.frameTitle{font:700 18px 'Segoe UI',Arial,sans-serif;fill:#123940}
      .component{fill:#fff;stroke:#355b61;stroke-width:2;filter:url(#shadow)}.implemented{fill:#e7f6f3;stroke:#147d72}.planned{fill:#fffaf0;stroke:#c78b22;stroke-dasharray:8 6}
      .ctitle{font:700 17px 'Segoe UI',Arial,sans-serif;fill:#17363b}.small{font:400 14px 'Segoe UI',Arial,sans-serif;fill:#49656a}.tiny{font:600 12px 'Segoe UI',Arial,sans-serif;fill:#5a7377}
      .line{fill:none;stroke:#38545a;stroke-width:2;marker-end:url(#arrow)}.dependency{fill:none;stroke:#38545a;stroke-width:2;stroke-dasharray:8 6;marker-end:url(#arrow)}
      .port{fill:#fff;stroke:#173f46;stroke-width:2}.iface{fill:#fff;stroke:#173f46;stroke-width:2}.label{font:600 13px 'Segoe UI',Arial,sans-serif;fill:#27474d}
      .legend{font:500 14px 'Segoe UI',Arial,sans-serif;fill:#2d4d52}.note{fill:#eef4f5;stroke:#91a8ac;stroke-width:1.5}
    </style>
  </defs>

  <rect width="1800" height="1180" fill="#edf3f3"/>
  <rect width="1800" height="92" fill="url(#header)"/>
  <text x="70" y="45" class="title">AutoTech S.A. — Diagrama de Componentes</text>
  <text x="70" y="72" class="subtitle">Monolito modular Laravel · incremento vigente ATSA-5 / ATSA-6 / ATSA-7</text>

  <!-- Clientes -->
  <rect x="55" y="145" width="250" height="365" rx="14" class="frame"/>
  <text x="180" y="178" text-anchor="middle" class="frameTitle">«client» Acceso</text>
  <rect x="85" y="220" width="190" height="90" rx="9" class="component implemented"/>
  <rect x="85" y="242" width="15" height="17" class="port"/><rect x="85" y="269" width="15" height="17" class="port"/>
  <text x="180" y="255" text-anchor="middle" class="ctitle">Navegador web</text>
  <text x="180" y="280" text-anchor="middle" class="small">HTML · CSS · JavaScript</text>
  <rect x="85" y="350" width="190" height="110" rx="9" class="component implemented"/>
  <rect x="85" y="375" width="15" height="17" class="port"/><rect x="85" y="404" width="15" height="17" class="port"/>
  <text x="180" y="385" text-anchor="middle" class="ctitle">AutoTech Desktop</text>
  <text x="180" y="411" text-anchor="middle" class="small">NativePHP + Electron</text>
  <text x="180" y="434" text-anchor="middle" class="small">ventana local Windows</text>

  <!-- Laravel -->
  <rect x="380" y="125" width="1040" height="900" rx="18" class="frame"/>
  <text x="900" y="160" text-anchor="middle" class="frameTitle">«subsystem» Aplicación AutoTech — Laravel 13</text>

  <rect x="430" y="205" width="280" height="130" rx="10" class="component implemented"/>
  <rect x="430" y="235" width="16" height="18" class="port"/><rect x="694" y="235" width="16" height="18" class="port"/>
  <text x="570" y="243" text-anchor="middle" class="ctitle">Presentación</text>
  <text x="570" y="271" text-anchor="middle" class="small">Blade + Bootstrap 5</text>
  <text x="570" y="295" text-anchor="middle" class="small">Vite + Bootstrap Icons</text>
  <text x="570" y="317" text-anchor="middle" class="tiny">Login y dashboard implementados</text>

  <rect x="785" y="205" width="280" height="130" rx="10" class="component implemented"/>
  <rect x="785" y="235" width="16" height="18" class="port"/><rect x="1049" y="235" width="16" height="18" class="port"/>
  <text x="925" y="243" text-anchor="middle" class="ctitle">Aplicación HTTP</text>
  <text x="925" y="271" text-anchor="middle" class="small">Routes · Controllers</text>
  <text x="925" y="295" text-anchor="middle" class="small">Form Requests · Middleware</text>
  <text x="925" y="317" text-anchor="middle" class="tiny">coordina casos de uso</text>

  <rect x="1140" y="205" width="230" height="130" rx="10" class="component implemented"/>
  <rect x="1140" y="235" width="16" height="18" class="port"/><rect x="1354" y="235" width="16" height="18" class="port"/>
  <text x="1255" y="243" text-anchor="middle" class="ctitle">Seguridad</text>
  <text x="1255" y="271" text-anchor="middle" class="small">Auth · sesiones · CSRF</text>
  <text x="1255" y="295" text-anchor="middle" class="small">roles · rate limiting</text>
  <text x="1255" y="317" text-anchor="middle" class="tiny">ATSA-7 implementado</text>

  <rect x="430" y="390" width="940" height="355" rx="13" class="frame"/>
  <text x="900" y="423" text-anchor="middle" class="frameTitle">«subsystem» Módulos funcionales</text>

  <g>
    <rect x="470" y="465" width="190" height="82" rx="8" class="component planned"/><text x="565" y="497" text-anchor="middle" class="ctitle">Clientes</text><text x="565" y="523" text-anchor="middle" class="small">y vehículos</text>
    <rect x="700" y="465" width="190" height="82" rx="8" class="component planned"/><text x="795" y="497" text-anchor="middle" class="ctitle">Proveedores</text><text x="795" y="523" text-anchor="middle" class="small">abastecimiento</text>
    <rect x="930" y="465" width="190" height="82" rx="8" class="component planned"/><text x="1025" y="497" text-anchor="middle" class="ctitle">Repuestos</text><text x="1025" y="523" text-anchor="middle" class="small">stock y catálogo</text>
    <rect x="1160" y="465" width="170" height="82" rx="8" class="component planned"/><text x="1245" y="497" text-anchor="middle" class="ctitle">Compras</text><text x="1245" y="523" text-anchor="middle" class="small">proveedores</text>
    <rect x="470" y="600" width="190" height="82" rx="8" class="component planned"/><text x="565" y="632" text-anchor="middle" class="ctitle">Turnos</text><text x="565" y="658" text-anchor="middle" class="small">y presupuestos</text>
    <rect x="700" y="590" width="420" height="102" rx="9" class="component planned" style="stroke-width:3"/><text x="910" y="627" text-anchor="middle" class="ctitle">Reparaciones</text><text x="910" y="654" text-anchor="middle" class="small">transacción principal · orden de trabajo</text><text x="910" y="676" text-anchor="middle" class="tiny">coordina clientes, vehículos, mecánicos y repuestos</text>
    <rect x="1160" y="600" width="170" height="82" rx="8" class="component planned"/><text x="1245" y="632" text-anchor="middle" class="ctitle">Facturación</text><text x="1245" y="658" text-anchor="middle" class="small">comprobantes</text>
  </g>

  <rect x="600" y="805" width="600" height="150" rx="11" class="component implemented"/>
  <rect x="600" y="844" width="16" height="18" class="port"/><rect x="1184" y="844" width="16" height="18" class="port"/>
  <text x="900" y="843" text-anchor="middle" class="ctitle">Persistencia y datos</text>
  <text x="900" y="873" text-anchor="middle" class="small">Eloquent ORM · modelos · migraciones · seeders</text>
  <text x="900" y="899" text-anchor="middle" class="small">transacciones · claves foráneas · consultas parametrizadas</text>
  <text x="900" y="928" text-anchor="middle" class="tiny">User y Role implementados · modelo funcional evolutivo</text>

  <!-- Infraestructura -->
  <rect x="1490" y="145" width="255" height="545" rx="14" class="frame"/>
  <text x="1617" y="178" text-anchor="middle" class="frameTitle">«infrastructure»</text>
  <rect x="1520" y="225" width="195" height="110" rx="9" class="component implemented"/>
  <text x="1617" y="261" text-anchor="middle" class="ctitle">MySQL / MariaDB</text>
  <text x="1617" y="289" text-anchor="middle" class="small">desarrollo web</text>
  <text x="1617" y="313" text-anchor="middle" class="tiny">PDO · esquema relacional</text>
  <rect x="1520" y="390" width="195" height="110" rx="9" class="component implemented"/>
  <text x="1617" y="426" text-anchor="middle" class="ctitle">SQLite</text>
  <text x="1617" y="454" text-anchor="middle" class="small">demo instalable</text>
  <text x="1617" y="478" text-anchor="middle" class="tiny">archivo local en AppData</text>
  <rect x="1520" y="555" width="195" height="90" rx="9" class="component implemented"/>
  <text x="1617" y="590" text-anchor="middle" class="ctitle">GitHub privado</text>
  <text x="1617" y="617" text-anchor="middle" class="small">código y versiones</text>

  <!-- Interfaces y dependencias -->
  <path d="M305 265 H430" class="line"/><circle cx="342" cy="265" r="10" class="iface"/><text x="338" y="245" class="label">IWeb</text>
  <path d="M305 405 C340 405 345 285 430 285" class="line"/><circle cx="342" cy="405" r="10" class="iface"/><text x="326" y="435" class="label">IDesktop</text>
  <path d="M710 270 H785" class="line"/><text x="724" y="253" class="label">HTTP</text>
  <path d="M1065 270 H1140" class="line"/><text x="1074" y="253" class="label">IAuth</text>
  <path d="M925 335 V390" class="line"/><text x="940" y="370" class="label">ICasosDeUso</text>
  <path d="M900 745 V805" class="line"/><text x="915" y="780" class="label">IRepositorio</text>
  <path d="M1200 855 C1360 855 1400 280 1520 280" class="line"/><circle cx="1458" cy="280" r="10" class="iface"/><text x="1370" y="272" class="label">IPersistencia SQL</text>
  <path d="M1200 895 C1380 895 1400 445 1520 445" class="line"/><circle cx="1458" cy="445" r="10" class="iface"/><text x="1382" y="437" class="label">IPersistencia local</text>
  <path d="M275 405 C335 405 330 600 380 600" class="dependency"/><text x="296" y="564" class="label">empaqueta y ejecuta</text>
  <path d="M1420 600 H1520" class="dependency"/><text x="1435" y="582" class="label">Git</text>

  <rect x="70" y="1070" width="1660" height="70" rx="10" class="note"/>
  <rect x="100" y="1092" width="38" height="22" rx="4" class="implemented"/><text x="150" y="1109" class="legend">Implementado en el incremento actual</text>
  <rect x="520" y="1092" width="38" height="22" rx="4" class="planned"/><text x="570" y="1109" class="legend">Arquitectura prevista para próximos incrementos</text>
  <text x="1110" y="1109" class="legend">Las dependencias punteadas representan integración o empaquetado.</text>
</svg>
