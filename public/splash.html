<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciando AutoTech</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            place-items: center;
            color: #f7fbfb;
            background:
                radial-gradient(circle at 20% 10%, rgba(20, 184, 166, 0.2), transparent 38%),
                linear-gradient(145deg, #07181b 0%, #0b2528 55%, #103a3d 100%);
        }

        main {
            display: grid;
            width: 100%;
            height: 100vh;
            padding: 42px;
            text-align: center;
            place-content: center;
        }

        .mark {
            display: grid;
            width: 64px;
            height: 64px;
            margin: 0 auto 22px;
            border: 1px solid rgba(94, 234, 212, 0.35);
            border-radius: 18px;
            place-items: center;
            color: #5eead4;
            background: rgba(15, 118, 110, 0.2);
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.3);
            font-size: 28px;
            font-weight: 800;
        }

        h1 {
            margin: 0;
            letter-spacing: 0.02em;
            font-size: 30px;
        }

        p {
            margin: 8px 0 24px;
            color: #b7cdce;
            font-size: 14px;
        }

        .loader {
            width: 180px;
            height: 4px;
            margin: 0 auto;
            overflow: hidden;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.1);
        }

        .loader::after {
            display: block;
            width: 45%;
            height: 100%;
            border-radius: inherit;
            background: #2dd4bf;
            content: "";
            animation: loading 1.15s ease-in-out infinite;
        }

        @keyframes loading {
            from {
                transform: translateX(-110%);
            }

            to {
                transform: translateX(330%);
            }
        }
    </style>
</head>
<body>
    <main>
        <div class="mark" aria-hidden="true">A</div>
        <h1>AutoTech</h1>
        <p>Preparando el sistema del taller…</p>
        <div class="loader" role="progressbar" aria-label="Iniciando aplicación"></div>
    </main>
</body>
</html>
